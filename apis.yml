name: Glyf
description: >-
  Glyf is an AI-powered creative tool for motion designers, studios, and creative
  teams, backed by Andreessen Horowitz (a16z Speedrun). It transforms 2D animations
  into stylized 3D with custom textures and effects, enhances live-action footage,
  and lets creators train bespoke AI models to match their own artistic direction,
  with exports into After Effects, Nuke, and other compositing pipelines. The product
  has since been rebranded and now ships as StyleFrame (www.styleframe.ai), a
  timeline-based, keyframe-driven video-generation platform where creators place
  keyframes and prompt tracks to control every frame of an animation. As of this
  enrichment pass, Glyf/StyleFrame is a consumer-facing creative application with no
  public API, developer documentation, OpenAPI definition, SDK, or machine-readable
  discovery surface.
